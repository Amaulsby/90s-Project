{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" class="auth-form">
    <table>
        <tr>
            <td>Username:</td>
            <td><input type="text" name="username"></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><input type="password" name="password"></td>
        </tr>
        <tr>
            <td colspan="2" class="center">
                <input type="submit" value="Log In">
            </td>
        </tr>
    </table>
</form>
{% endblock %}
